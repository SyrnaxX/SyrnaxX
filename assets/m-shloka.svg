<circle cx="660" cy="42" r="5" fill="#ef6a5e"/><circle cx="678" cy="42" r="5" fill="#e8b04a"/><circle cx="696" cy="42" r="5" fill="#5ec26a"/><text x="720" y="47" font-size="12" fill="#a8998a">karma_yoga.py</text>
<text x="662" y="86"><tspan fill="#e0803f">def</tspan><tspan fill="#f3d9a0"> karma</tspan><tspan fill="#a8998a">(work):</tspan></text>
<text x="690" y="114"><tspan fill="#a8998a">do(work)</tspan><tspan fill="#6f6254">   # my right is the action</tspan></text>
<text x="690" y="142"><tspan fill="#e0803f">return</tspan><tspan fill="#a8998a"> None</tspan><tspan fill="#6f6254">   # never the fruit</tspan></text>
