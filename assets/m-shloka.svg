<text x="316" y="146" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="19" fill="#f3ead9">Focus on the work, not on the result.</text>
<text x="316" y="176" text-anchor="middle" font-family="'JetBrains Mono',Consolas,monospace" font-size="12" letter-spacing="2" fill="#d9a441">BHAGAVAD GITA · 2.47</text>
