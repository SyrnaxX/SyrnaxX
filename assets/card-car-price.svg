<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 224" width="600" height="224" role="img" aria-label="Car Price Prediction">
<defs>
<clipPath id="c"><rect width="600" height="224" rx="18"/></clipPath>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#18181c"/><stop offset="1" stop-color="#0b0b0d"/></linearGradient>
<linearGradient id="m" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="420" y2="84" spreadMethod="repeat"><stop offset="0" stop-color="#5b6272"/><stop offset=".18" stop-color="#e9edf3"/><stop offset=".34" stop-color="#8d96a6"/><stop offset=".5" stop-color="#ffffff"/><stop offset=".66" stop-color="#737c8c"/><stop offset=".82" stop-color="#d3d9e3"/><stop offset="1" stop-color="#5b6272"/><animateTransform attributeName="gradientTransform" type="translate" values="0 0;420 0" dur="6.6s" repeatCount="indefinite"/></linearGradient>
<linearGradient id="sh" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".09"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="ar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4ade80" stop-opacity=".25"/><stop offset="1" stop-color="#4ade80" stop-opacity="0"/></linearGradient>
</defs>
<g clip-path="url(#c)">
<rect width="600" height="224" fill="url(#bg)"/>
<text x="30" y="38" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="12" letter-spacing="2" fill="#6e6e7a">PROJECT / 05</text>
<rect x="466" y="21" width="104" height="24" rx="12" fill="#14201a" stroke="#1f3a2b"/>
<circle cx="480" cy="33" r="3" fill="#4ade80"><animate attributeName="opacity" values="1;.25;1" dur="2s" repeatCount="indefinite"/></circle>
<text x="490" y="37" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="11" fill="#4ade80">REGRESSION</text>
<text x="30" y="84" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="26" font-weight="700" letter-spacing="-.4" fill="url(#m)">Car Price Prediction</text>
<text x="30" y="112" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#9a9aa6">Predicts used-vehicle prices using regression</text><text x="30" y="133" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#9a9aa6">algorithms with feature engineering and tuned</text><text x="30" y="154" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#9a9aa6">ensemble models.</text>
<rect x="30" y="178" width="66" height="26" rx="13" fill="#1a1a1f" stroke="#2c2c34"/><text x="63" y="195" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="12" fill="#b4b8c4">Python</text><rect x="104" y="178" width="118" height="26" rx="13" fill="#1a1a1f" stroke="#2c2c34"/><text x="164" y="195" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="12" fill="#b4b8c4">Random Forest</text><rect x="231" y="178" width="74" height="26" rx="13" fill="#1a1a1f" stroke="#2c2c34"/><text x="268" y="195" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="12" fill="#b4b8c4">XGBoost</text>
<g transform="translate(430,98)">
<path d="M0,44 L30,46 L60,30 L90,32 L120,18 L150,12 L150,70 L0,70Z" fill="url(#ar)"/>
<path d="M0,44 L30,46 L60,30 L90,32 L120,18 L150,12" fill="none" stroke="#4ade80" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"><animate attributeName="stroke-dashoffset" values="1;0;0;1" keyTimes="0;.45;.9;1" dur="5s" repeatCount="indefinite"/></path>
</g>
<rect y="-10" width="150" height="260" fill="url(#sh)" transform="skewX(-18)"><animate attributeName="x" values="-260;760" dur="8.8s" repeatCount="indefinite"/></rect>
<circle r="2" fill="#fff" opacity=".7"><animateTransform attributeName="transform" type="translate" values="520 -6;470 230" dur="6s" repeatCount="indefinite"/></circle>
<circle r="1.5" fill="#fff" opacity=".6"><animateTransform attributeName="transform" type="translate" values="300 -6;330 230" dur="8s" begin="-3s" repeatCount="indefinite"/></circle>
</g>
<rect x=".5" y=".5" width="599" height="223" rx="18" fill="none" stroke="#2a2a31"/>
