<text x="200" y="116" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#d9ccb8">Content-based recommender: TF-IDF and cosine</text><text x="200" y="136" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#d9ccb8">similarity find movies like the one you pick, with</text><text x="200" y="156" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#d9ccb8">posters and details from the TMDB API. FastAPI</text><text x="200" y="176" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#d9ccb8">backend, Streamlit web app.</text><rect x="200" y="200" width="62" height="26" rx="13.0" fill="#ffffff" fill-opacity=".06" stroke="#8fc98a" stroke-opacity=".38"/><text x="231" y="217.0" text-anchor="middle" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#eef0e4">TF-IDF</text><rect x="270" y="200" width="95" height="26" rx="13.0" fill="#ffffff" fill-opacity=".06" stroke="#8fc98a" stroke-opacity=".38"/><text x="318" y="217.0" text-anchor="middle" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#eef0e4">Cosine Sim.</text><rect x="373" y="200" width="69" height="26" rx="13.0" fill="#ffffff" fill-opacity=".06" stroke="#8fc98a" stroke-opacity=".38"/><text x="408" y="217.0" text-anchor="middle" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#eef0e4">FastAPI</text><rect x="450" y="200" width="82" height="26" rx="13.0" fill="#ffffff" fill-opacity=".06" stroke="#8fc98a" stroke-opacity=".38"/><text x="491" y="217.0" text-anchor="middle" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#eef0e4">Streamlit</text><text x="576" y="238" text-anchor="end" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#8fc98a">Open repository <tspan><animate attributeName="dx" values="0;5;0" dur="1.6s" repeatCount="indefinite"/>↗</