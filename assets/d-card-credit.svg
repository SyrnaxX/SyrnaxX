<text x="262" y="88" font-family="Georgia,'Times New Roman',serif" font-size="34" font-weight="700" fill="url(#m)">Credit Risk Analyzer</text>
<text x="262" y="112" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#e1d4c0">End-to-end ML pipeline that predicts loan defaults using Calibrated XGBoost. Robust preprocessing,</text><text x="262" y="134" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#e1d4c0">probability calibration for accurate risk scoring, and SHAP explainability for transparent decisions.</text><rect x="262" y="168" width="212" height="52" rx="12" fill="#ffffff" fill-opacity=".05" stroke="#f0b45a" stroke-opacity=".28"/><circle cx="284" cy="194" r="5" fill="#f0b45a"/><text x="298" y="191" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#f1e6d6">Calibrated XGBoost</text><text x="298" y="208" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#a99a85">gradient-boosted risk model</text><rect x="486" y="168" width="212" height="52" rx="12" fill="#ffffff" fill-opacity=".05" stroke="#f0b45a" stroke-opacity=".28"/><circle cx="508" cy="194" r="5" fill="#f0b45a"/><text x="522" y="191" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#f1e6d6">Probability calibration</text><text x="522" y="208" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#a99a85">trustworthy default odds</text><rect x="710" y="168" width="212" height="52" rx="12" fill="#ffffff" fill-opacity=".05" stroke="#f0b45a" stroke-opacity=".28"/><circle cx="732" cy="194" r="5" fill="#f0b45a"/><text x="746" y="191" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#f1e6d6">SHAP explainability</text><text x="746" y="208" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#a99a85">see why a loan is risky</text><rect x="934" y="168" width="212" height="52" rx="12" fill="#ffffff" fill-opacity=".05" stroke="#f0b45a" stroke-opacity=".28"/><circle cx="956" cy="194" r="5" fill="#f0b45a"/><text x="970" y="191" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#f1e6d6">FastAPI + web UI</text><text x="970" y="208" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#a99a85">live app, deployed on Render</text><rect x="262" y="238" width="62" height="26" rx="13.0" fill="#ffffff" fill-opacity=".06" stroke="#f0b45a" stroke-opacity=".38"/><text x="293" y="255.0" text-anchor="middle" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#f1e6d6">Python</text><rect x="332" y="238" width="69" height="26" rx="13.0" fill="#ffffff" fill-opacity=".06" stroke="#f0b45a" stroke-opacity=".38"/><text x="366" y="255.0" text-anchor="middle" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#f1e6d6">XGBoost</text><rect x="409" y="238" width="49" height="26" rx="13.0" fill="#ffffff" fill-opacity=".06" stroke="#f0b45a" stroke-opacity=".38"/><text x="433" y="255.0" text-anchor="middle" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#f1e6d6">SHAP</text><rect x="465" y="238" width="69" height="26" rx="13.0" fill="#ffffff" fill-opacity=".06" stroke="#f0b45a" stroke-opacity=".38"/><text x="500" y="255.0" text-anchor="middle" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#f1e6d6">FastAPI</text><rect x="542" y="238" width="102" height="26" rx="13.0" fill="#ffffff" fill-opacity=".06" stroke="#f0b45a" stroke-opacity=".38"/><text x="593" y="255.0" text-anchor="middle" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#f1e6d6">scikit-learn</text><rect x="652" y="238" width="62" height="26" rx="13.0" fill="#ffffff" fill-opacity=".06" stroke="#f0b45a" stroke-opacity=".38"/><text x="683" y="255.0" text-anchor="middle" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#f1e6d6">Render</text><text x="1166" y="264" text-anchor="end" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#f0b45a">Open repository <tspan><animate attributeName="dx" values="0;5;0" dur="1.6s" repeatCount="indefinite"/>↗</tspan></text><rect y="-10" width="140" height="310" fill="url(#sheen)" transform="skewX(-16)"><animate attributeName="x" values="-300;1300" dur="8s" begin="0s" repeatCount="indefinite"/></rect></g><rect x=".5" y=".5" width="1199" height="289" rx="26" fill="none" stroke="#3a2e22"/></svg>