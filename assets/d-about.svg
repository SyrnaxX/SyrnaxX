<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" width="1200" height="290" role="img" aria-label="About me, what I am learning right now, and a quote"><defs><linearGradient id="cd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b1822"/><stop offset="1" stop-color="#0f0e14"/></linearGradient>
