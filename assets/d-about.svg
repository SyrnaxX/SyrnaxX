<text x="82" y="60" font-family="Georgia,'Times New Roman',serif" font-size="26" font-weight="700" fill="url(#m)">About Me</text><text x="42" y="98" font-family="Georgia,'Times New Roman',serif" font-size="15.5" fill="#e8dcc8">I’m a Computer Science (Hons.) student at the</text><text x="42" y="122" font-family="Georgia,'Times New Roman',serif" font-size="15.5" fill="#e8dcc8">University of Delhi, fascinated by the AI domain.</text><text x="42" y="146" font-family="Georgia,'Times New Roman',serif" font-size="15.5" fill="#e8dcc8">I want to solve real-world problems with AI, and I</text><text x="42" y="170" font-family="Georgia,'Times New Roman',serif" font-size="15.5" fill="#e8dcc8">don’t just learn: I build a project at every step</text><text x="42" y="194" font-family="Georgia,'Times New Roman',serif" font-size="15.5" fill="#e8dcc8">of the journey.</text><rect x="40" y="226" width="133" height="26" rx="13.0" fill="#ffffff" fill-opacity=".06" stroke="#f0b45a" stroke-opacity=".38"/><text x="107" y="243.0" text-anchor="middle" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#f1e6d6">New Delhi, India</text><rect x="181" y="226" width="224" height="26" rx="13.0" fill="#ffffff" fill-opacity=".06" stroke="#f0b45a" stroke-opacity=".38"/><text x="293" y="243.0" text-anchor="middle" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#f1e6d6">Delhi University · CS (Hons.)</text>
<rect x="462" y="16" width="400" height="258" rx="22" fill="url(#cd)" stroke="#3a2e22"/><text x="494" y="58" font-family="Georgia,'Times New Roman',serif" font-size="26" font-weight="700" fill="url(#m)">Right Now</text>
<rect x="760" y="40" width="74" height="24" rx="12" fill="#1d2a1c" stroke="#2f4a2c"/><circle cx="776" cy="52" r="3.5" fill="#4ade80"><animate attributeName="opacity" values="1;.2;1" dur="1.6s" repeatCount="indefinite"/></circle><text x="786" y="56" font-family="'JetBrains Mono',Consolas,monospace" font-size="11" fill="#4ade80">LIVE</text>
<circle cx="494" cy="96" r="5" fill="#f0b45a"/><circle cx="494" cy="96" r="5" fill="none" stroke="#f0b45a"><animate attributeName="r" values="5;14" dur="2.8s" begin="0.0s" repeatCount="indefinite"/><animate attributeName="opacity" values=".8;0" dur="2.8s" begin="0.0s" repeatCount="indefinite"/></circle><text x="514" y="98" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#f1e6d6">Machine Learning</text><text x="514" y="116" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#a99a85">Building practical models end to end</text><circle cx="494" cy="146" r="5" fill="#f0b45a"/><circle cx="494" cy="146" r="5" fill="none" stroke="#f0b45a"><animate attributeName="r" values="5;14" dur="2.8s" begin="0.9s" repeatCount="indefinite"/><animate attributeName="opacity" values=".8;0" dur="2.8s" begin="0.9s" repeatCount="indefinite"/></circle><text x="514" y="148" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#f1e6d6">Backend with FastAPI</text><text x="514" y="166" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#a99a85">Serving trained models as APIs</text><circle cx="494" cy="196" r="5" fill="#f0b45a"/><circle cx="494" cy="196" r="5" fill="none" stroke="#f0b45a"><animate attributeName="r" values="5;14" dur="2.8s" begin="1.8s" repeatCount="indefinite"/><animate attributeName="opacity" values=".8;0" dur="2.8s" begin="1.8s" repeatCount="indefinite"/></circle><text x="514" y="198" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#f1e6d6">NLP</text><text x="514" y="216" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#a99a85">Text classification and beyond</text><rect x="480" y="238" width="48" height="26" rx="13.0" fill="#ffffff" fill-opacity=".06" stroke="#f0b45a" stroke-opacity=".38"/><text x="504" y="255.0" text-anchor="middle" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#f1e6d6">Next</text><rect x="536" y="238" width="105" height="26" rx="13.0" fill="#ffffff" fill-opacity=".06" stroke="#f0b45a" stroke-opacity=".38"/><text x="588" y="255.0" text-anchor="middle" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#f1e6d6">Deep Learning</text><rect x="648" y="238" width="60" height="26" rx="13.0" fill="#ffffff" fill-opacity=".06" stroke="#f0b45a" stroke-opacity=".38"/><text x="679" y="255.0" text-anchor="middle" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#f1e6d6">Gen AI</text><rect x="717" y="238" width="86" height="26" rx="13.0" fill="#ffffff" fill-opacity=".06" stroke="#f0b45a" stroke-opacity=".38"/><text x="760" y="255.0" text-anchor="middle" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#f1e6d6">Agentic AI</text>
